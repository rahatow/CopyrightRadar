{% extends "base.html" %}
{% block body %}
<main class="narrow">
  <h1>{{ t.login_title }}</h1>
  {% if error %}<p class="msg err">{{ t.login_error }}</p>{% endif %}
  <form method="post" action="/login" class="stack">
    <label>{{ t.password }}<input type="password" name="password" autocomplete="current-password" required autofocus></label>
    <button class="btn">{{ t.login_btn }}</button>
  </form>
</main>
{% endblock %}
