[project]
name = "copyright-radar"
version = "0.1.0"
description = "Self-hosted check of music in your own Instagram Reels for copyright-claim risk. Not legal advice."
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn==0.34.0",
  "httpx==0.28.1",
  "jinja2==3.1.5",
  "cryptography==44.0.0",
  "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["web/i18n/*.json", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
